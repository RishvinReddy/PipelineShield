name: CI Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-test:
    name: Engine Unit & Coverage Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install engine dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./engine[test]"

      - name: Run pytest with coverage
        run: |
          pytest --cov=pipelineshield --cov-report=term-missing --cov-report=xml:reports/coverage.xml engine/tests

      - name: Upload engine test coverage
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: engine-coverage
          path: reports/coverage.xml
          retention-days: 7

  dashboard-build:
    name: Dashboard Lint & Build Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 20
        uses: actions/setup-node@1e60f6391960146644d41f2d1200fcdcc04fa3e6 # v4.2.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Run ESLint
        working-directory: dashboard
        run: npm run lint

      - name: Build Next.js dashboard
        working-directory: dashboard
        run: npm run build

  security-gate:
    name: DevSecOps Policy Enforcement Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [engine-test, dashboard-build]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Install PipelineShield Engine
        run: |
          python -m pip install --upgrade pip
          pip install -e ./engine

      - name: Create reports directory
        run: mkdir -p reports

      - name: Install & Run Trivy Vulnerability Scanner
        run: |
          TRIVY_VERSION="0.76.1"
          TRIVY_SHA256="c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0"
          curl -sSL -O "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | sha256sum --check
          tar -xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -C /usr/local/bin trivy
          rm -f "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"

          # Extract scan types configured in policy.yaml
          TRIVY_SCANNERS=$(python3 -c "from pipelineshield.config import load_policy; p = load_policy('config/policy.yaml'); print(','.join(p.scanners.trivy.scan_types))")
          trivy fs --scanners "$TRIVY_SCANNERS" --exit-code 0 --format json --output reports/trivy.json .
          python3 -c "import json; json.load(open('reports/trivy.json'))"

      - name: Install & Run Semgrep SAST
        run: |
          pip install semgrep==1.183.0

          # Build ruleset arguments configured in policy.yaml
          SEMGREP_RULES=$(python3 -c "from pipelineshield.config import load_policy; p = load_policy('config/policy.yaml'); print(' '.join(f'--config \"{r}\"' for r in p.scanners.semgrep.rulesets))")
          eval "semgrep scan $SEMGREP_RULES --json --output reports/semgrep.json"
          python3 -c "import json; json.load(open('reports/semgrep.json'))"

      - name: Run GitHub Dependency Review
        id: dependency-review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@3c4e3dcb1aa7874d2c16be7d79418e9b7efd6261 # v4.8.2
        with:
          warn-only: true
          license-check: false

      - name: Export Dependency Review findings
        if: github.event_name == 'pull_request'
        env:
          DEP_CHANGES: ${{ steps.dependency-review.outputs.dependency-changes }}
        run: |
          if [ -z "${DEP_CHANGES// }" ]; then
            echo "[]" > reports/dependency-review.json
          else
            echo "$DEP_CHANGES" > reports/dependency-review.json
          fi
          python3 -c "import json; json.load(open('reports/dependency-review.json'))"

      - name: Run PipelineShield Security Gate
        id: gate
        run: |
          DEP_FLAG=""
          if [ -f reports/dependency-review.json ]; then
            DEP_FLAG="--dependency-review reports/dependency-review.json"
          fi

          python -m pipelineshield.cli \
            --policy config/policy.yaml \
            --trivy reports/trivy.json \
            --semgrep reports/semgrep.json \
            $DEP_FLAG \
            --output reports/security-summary.json \
            --summary-md "$GITHUB_STEP_SUMMARY"

      - name: Upload Security Reports Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: security-summary-reports
          path: reports/
          retention-days: 14
