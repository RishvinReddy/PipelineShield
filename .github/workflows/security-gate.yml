name: CI Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  engine-test:
    name: Engine Unit & Coverage Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install engine dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./engine[test]"

      - name: Run pytest with coverage
        run: |
          pytest --cov=pipelineshield --cov-report=term-missing --cov-report=xml:reports/coverage.xml engine/tests

      - name: Upload engine test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-coverage
          path: reports/coverage.xml
          retention-days: 7

  dashboard-build:
    name: Dashboard Lint & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Run ESLint
        working-directory: dashboard
        run: npm run lint

      - name: Build Next.js dashboard
        working-directory: dashboard
        run: npm run build

  security-gate:
    name: DevSecOps Policy Enforcement Gate
    runs-on: ubuntu-latest
    needs: [engine-test, dashboard-build]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PipelineShield Engine
        run: |
          python -m pip install --upgrade pip
          pip install -e ./engine

      - name: Create reports directory
        run: mkdir -p reports

      - name: Install & Run Trivy Vulnerability Scanner
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy fs --format json --output reports/trivy.json . || true
          # Verify trivy output exists; if empty or missing, write fallback clean schema
          if [ ! -s reports/trivy.json ]; then
            echo '{"SchemaVersion": 2, "Results": []}' > reports/trivy.json
          fi

      - name: Install & Run Semgrep SAST
        run: |
          pip install semgrep
          semgrep scan --config "p/security-audit" --config "p/secrets" --config "p/owasp-top-ten" --json --output reports/semgrep.json || true
          if [ ! -s reports/semgrep.json ]; then
            echo '{"results": [], "errors": []}' > reports/semgrep.json
          fi

      - name: Run PipelineShield Security Gate
        id: gate
        run: |
          python -m pipelineshield.cli \
            --policy config/policy.yaml \
            --trivy reports/trivy.json \
            --semgrep reports/semgrep.json \
            --output reports/security-summary.json \
            --summary-md "$GITHUB_STEP_SUMMARY"

      - name: Upload Security Reports Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-summary-reports
          path: reports/
          retention-days: 14
