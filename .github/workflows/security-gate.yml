name: CI Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      simulate_scanner_failure:
        description: "Controlled scanner failure simulation for DevSecOps demonstration"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - trivy
          - semgrep
          - dependency_review

permissions:
  contents: read

jobs:
  engine-test:
    name: Engine Unit & Coverage Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install engine dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./engine[test]"

      - name: Run pytest with coverage
        run: |
          pytest --cov=pipelineshield --cov-report=term-missing --cov-report=xml:reports/coverage.xml engine/tests

      - name: Upload engine test coverage
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: engine-coverage
          path: reports/coverage.xml
          retention-days: 7

  dashboard-build:
    name: Dashboard Lint, Contract & Build Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11 for contract generation
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install engine dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./engine

      - name: Set up Node.js 22
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Run Dashboard Contract Tests
        working-directory: dashboard
        run: npm run test:contract
        env:
          PYTHON: python3

      - name: Run ESLint
        working-directory: dashboard
        run: npm run lint

      - name: Build Next.js dashboard
        working-directory: dashboard
        run: npm run build

  security-gate:
    name: DevSecOps Policy Enforcement Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [engine-test, dashboard-build]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Install PipelineShield Engine
        run: |
          python -m pip install --upgrade pip
          pip install -e ./engine

      - name: Create reports directory
        run: mkdir -p reports

      - name: Install & Run Trivy Vulnerability Scanner
        id: trivy
        continue-on-error: true
        env:
          SIMULATE_FAILURE: ${{ inputs.simulate_scanner_failure }}
        run: |
          if [ "$SIMULATE_FAILURE" = "trivy" ]; then
            echo "[SIMULATION] Simulating controlled Trivy scanner failure."
            exit 1
          fi
          TRIVY_ENABLED=$(python3 -c "from pipelineshield.config import load_policy; p = load_policy('config/policy.yaml'); print('true' if p.scanners.trivy.enabled else 'false')")
          if [ "$TRIVY_ENABLED" != "true" ]; then
            echo "Trivy scanner is disabled in policy.yaml — skipping execution."
            exit 0
          fi
          TRIVY_VERSION="0.76.1"
          TRIVY_SHA256="c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0"
          curl -sSL -O "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | sha256sum --check
          tar -xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -C /usr/local/bin trivy
          rm -f "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"

          # Extract scan types configured in policy.yaml
          TRIVY_SCANNERS=$(python3 -c "from pipelineshield.config import load_policy; p = load_policy('config/policy.yaml'); print(','.join(p.scanners.trivy.scan_types))")
          trivy fs --scanners "$TRIVY_SCANNERS" --exit-code 0 --format json --output reports/trivy.json .
          python3 -c "import json; json.load(open('reports/trivy.json'))"

      - name: Install & Run Semgrep SAST
        id: semgrep
        continue-on-error: true
        env:
          SIMULATE_FAILURE: ${{ inputs.simulate_scanner_failure }}
        run: |
          if [ "$SIMULATE_FAILURE" = "semgrep" ]; then
            echo "[SIMULATION] Simulating controlled Semgrep scanner failure."
            exit 1
          fi
          SEMGREP_ENABLED=$(python3 -c "from pipelineshield.config import load_policy; p = load_policy('config/policy.yaml'); print('true' if p.scanners.semgrep.enabled else 'false')")
          if [ "$SEMGREP_ENABLED" != "true" ]; then
            echo "Semgrep scanner is disabled in policy.yaml — skipping execution."
            exit 0
          fi
          pip install semgrep==1.183.0

          # Execute Semgrep using safe argument array without shell eval
          python3 -c "
          import subprocess, sys
          from pipelineshield.config import load_policy
          p = load_policy('config/policy.yaml')
          cmd = ['semgrep', 'scan']
          for r in p.scanners.semgrep.rulesets:
              cmd.extend(['--config', r])
          cmd.extend(['--json', '--output', 'reports/semgrep.json'])
          res = subprocess.run(cmd)
          sys.exit(res.returncode)
          "
          python3 -c "import json; json.load(open('reports/semgrep.json'))"

      - name: Check Dependency Review Policy Enablement
        id: check-dep-review
        if: github.event_name == 'pull_request'
        run: |
          DEP_ENABLED=$(python3 -c "from pipelineshield.config import load_policy; p = load_policy('config/policy.yaml'); print('true' if p.scanners.dependency_review.enabled else 'false')")
          echo "enabled=$DEP_ENABLED" >> "$GITHUB_OUTPUT"

      - name: Run GitHub Dependency Review
        id: dependency-review
        continue-on-error: true
        if: github.event_name == 'pull_request' && steps.check-dep-review.outputs.enabled == 'true'
        uses: actions/dependency-review-action@3c4e3dcb1aa7874d2c16be7d79418e9b7efd6261 # v4.8.2
        with:
          warn-only: true
          license-check: false

      - name: Export Dependency Review findings
        id: export-dep-review
        continue-on-error: true
        if: github.event_name == 'pull_request' && steps.check-dep-review.outputs.enabled == 'true'
        env:
          DEP_CHANGES: ${{ steps.dependency-review.outputs.dependency-changes }}
          DEP_OUTCOME: ${{ steps.dependency-review.outcome }}
          SIMULATE_FAILURE: ${{ inputs.simulate_scanner_failure }}
        run: |
          if [ "$SIMULATE_FAILURE" = "dependency_review" ]; then
            echo "[SIMULATION] Simulating controlled Dependency Review failure."
            exit 1
          fi
          if [ "$DEP_OUTCOME" != "success" ]; then
            echo "Dependency Review action step failed."
            exit 1
          fi
          if [ -z "${DEP_CHANGES// }" ]; then
            echo "[]" > reports/dependency-review.json
          else
            echo "$DEP_CHANGES" > reports/dependency-review.json
          fi
          python3 -c "import json; json.load(open('reports/dependency-review.json'))"

      - name: Run PipelineShield Security Gate
        id: gate
        env:
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
          SEMGREP_OUTCOME: ${{ steps.semgrep.outcome }}
          DEP_OUTCOME: ${{ steps.dependency-review.outcome }}
          DEP_EXPORT_OUTCOME: ${{ steps.export-dep-review.outcome }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_BRANCH: ${{ github.head_ref || github.ref_name }}
          GH_SHA: ${{ github.sha }}
          GH_PR_NUM: ${{ github.event.pull_request.number }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_SERVER_URL: ${{ github.server_url }}
        run: |
          ARGS=()
          STATUS_OVERRIDES=()

          # --- Trivy outcome & report check ---
          if [ "$TRIVY_OUTCOME" = "failure" ]; then
            echo "[CI] Trivy step failed execution."
            STATUS_OVERRIDES+=("trivy=FAILED")
          elif [ -f reports/trivy.json ] && python3 -c "import json; json.load(open('reports/trivy.json'))" 2>/dev/null; then
            ARGS+=(--trivy reports/trivy.json)
          else
            TRIVY_ENABLED=$(python3 -c "from pipelineshield.config import load_policy; p = load_policy('config/policy.yaml'); print('true' if p.scanners.trivy.enabled else 'false')")
            if [ "$TRIVY_ENABLED" = "true" ]; then
              echo "[CI] Trivy report missing or invalid JSON."
              STATUS_OVERRIDES+=("trivy=FAILED")
            fi
          fi

          # --- Semgrep outcome & report check ---
          if [ "$SEMGREP_OUTCOME" = "failure" ]; then
            echo "[CI] Semgrep step failed execution."
            STATUS_OVERRIDES+=("semgrep=FAILED")
          elif [ -f reports/semgrep.json ] && python3 -c "import json; json.load(open('reports/semgrep.json'))" 2>/dev/null; then
            ARGS+=(--semgrep reports/semgrep.json)
          else
            SEMGREP_ENABLED=$(python3 -c "from pipelineshield.config import load_policy; p = load_policy('config/policy.yaml'); print('true' if p.scanners.semgrep.enabled else 'false')")
            if [ "$SEMGREP_ENABLED" = "true" ]; then
              echo "[CI] Semgrep report missing or invalid JSON."
              STATUS_OVERRIDES+=("semgrep=FAILED")
            fi
          fi

          # --- Dependency Review outcome & report check ---
          if [ "$GH_EVENT_NAME" != "pull_request" ]; then
            STATUS_OVERRIDES+=("dependency_review=NOT_APPLICABLE")
          elif [ "$DEP_OUTCOME" = "failure" ] || [ "$DEP_EXPORT_OUTCOME" = "failure" ]; then
            echo "[CI] Dependency Review step or findings export failed."
            STATUS_OVERRIDES+=("dependency_review=FAILED")
          elif [ -f reports/dependency-review.json ] && python3 -c "import json; json.load(open('reports/dependency-review.json'))" 2>/dev/null; then
            ARGS+=(--dependency-review reports/dependency-review.json)
          else
            DEP_ENABLED=$(python3 -c "from pipelineshield.config import load_policy; p = load_policy('config/policy.yaml'); print('true' if p.scanners.dependency_review.enabled else 'false')")
            if [ "$DEP_ENABLED" = "true" ]; then
              echo "[CI] Dependency Review report missing or invalid JSON."
              STATUS_OVERRIDES+=("dependency_review=FAILED")
            fi
          fi

          # Assemble CLI arguments
          CMD=(python -m pipelineshield.cli --policy config/policy.yaml --event-name "$GH_EVENT_NAME")
          CMD+=(--repository "$GH_REPOSITORY")
          CMD+=(--branch "$GH_BRANCH")
          CMD+=(--commit "$GH_SHA")
          if [ -n "$GH_PR_NUM" ]; then
            CMD+=(--pull-request "$GH_PR_NUM")
          fi
          CMD+=(--workflow-run-id "$GH_RUN_ID")
          CMD+=(--workflow-run-url "$GH_SERVER_URL/$GH_REPOSITORY/actions/runs/$GH_RUN_ID")
          CMD+=(--output reports/security-summary.json)
          CMD+=(--summary-md "$GITHUB_STEP_SUMMARY")

          if [ ${#ARGS[@]} -gt 0 ]; then
            CMD+=("${ARGS[@]}")
          fi

          if [ ${#STATUS_OVERRIDES[@]} -gt 0 ]; then
            CMD+=(--scanner-status "${STATUS_OVERRIDES[@]}")
          fi

          echo "Executing security gate:"
          echo "${CMD[@]}"
          "${CMD[@]}"

      - name: Upload Security Reports Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: security-summary-reports
          path: reports/
          retention-days: 14
